<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumby - Grid World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #arcade-logo {
      width: 1120px;
      height: auto;
      margin-top: 10px;
      margin-bottom: 20px;
      image-rendering: pixelated;
      z-index: 600;
      position: relative;
    }

    /* Start Screen Overlay */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 50px;
      box-sizing: border-box;
      transition: opacity 1.2s ease-in-out;
    }

    /* Arrow Buttons Container */
    #hue-controls {
      position: absolute;
      top: 50vh;
      left: 50vw;
      transform: translate(-50%, -50%);
      width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 560;
      pointer-events: none; /* Let clicks pass through empty space to Jumby */
    }

    .arrow-btn {
      width: 70px;
      height: auto;
      image-rendering: pixelated;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s ease;
    }

    .arrow-btn:hover {
      transform: scale(1.15);
    }

    /* Title Screen Menu Buttons Row */
    #menu-buttons-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 70px;
      z-index: 560;
    }

    .menu-btn {
      height: 70px;
      width: auto;
      image-rendering: pixelated;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .menu-btn:hover {
      transform: scale(1.08);
    }

    /* Play button noticeably larger */
    #play-btn-img {
      height: 140px;
    }

    /* Room Canvas */
    #room {
      width: 600px;
      height: 400px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(12, 50px);
      grid-template-rows: repeat(8, 50px);
      transform: scale(1.5);
      transform-origin: top center;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      z-index: 100;
    }

    /* Game Over Overlay */
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #lose-img {
      width: 300px;
      height: auto;
      image-rendering: pixelated;
      margin-bottom: 20px;
    }

    #game-over-text {
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .tile {
      width: 50px;
      height: 50px;
      background-size: cover;
      image-rendering: pixelated;
    }

    .door-top {
      transform: rotate(180deg);
    }

    /* Standalone Jumby Player Container */
    #player {
      width: 48px;
      height: 80px;
      position: fixed;
      z-index: 550;
      transform-origin: center center;
      cursor: pointer;
    }

    #player img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      image-rendering: pixelated;
      object-fit: contain;
    }

    #player.invincible {
      animation: playerHit 0.2s infinite;
    }

    @keyframes playerHit {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .start-animation {
      animation: bounceSpinShrink 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes bounceSpinShrink {
      0% {
        transform: translate(-50%, -50%) scale(6) rotate(0deg);
      }
      25% {
        transform: translate(-50%, -50%) scale(6.8) rotate(0deg);
      }
      100% {
        transform: translate(0, 0) scale(1) rotate(360deg);
      }
    }

    /* White outline flashing for interactible elements */
    .interact-highlight {
      animation: flashWhiteOutline 0.8s infinite alternate !important;
    }

    @keyframes flashWhiteOutline {
      0% {
        filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.4));
      }
      100% {
        filter: drop-shadow(0px 0px 12px rgba(255, 255, 255, 1)) drop-shadow(0px 0px 3px white);
      }
    }

    #orb {
      width: 100px;
      height: 100px;
      position: absolute;
      left: 250px;
      top: 150px;
      z-index: 5;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      display: none;
    }

    #key-item {
      width: 32px;
      height: 32px;
      position: absolute;
      z-index: 6;
      background-image: url('key.png');
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      display: none;
    }

    .star-entity {
      width: 48px;
      height: 80px;
      position: absolute;
      z-index: 8;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      transition: opacity 0.6s ease-out, filter 0.1s ease;
    }

    .star-entity.hit {
      filter: drop-shadow(0px 0px 0px red) sepia(1) hue-rotate(-50deg) saturate(1000%);
    }

    .bullet {
      width: 16px;
      height: 16px;
      position: absolute;
      z-index: 15;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .enemy-bullet {
      width: 16px;
      height: 16px;
      position: absolute;
      z-index: 14;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #dialog-box {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 12px 20px;
      border: 2px solid #fff;
      font-size: 14px;
      display: none;
      z-index: 20;
      text-align: center;
    }

    .dialog-options {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .option {
      padding: 2px 8px;
      color: #888;
      cursor: pointer;
    }

    .option.selected {
      color: #fff;
      background: #444;
      border-radius: 3px;
    }

    /* HUD Elements */
    #hud-container {
      margin-top: 195px;
      display: flex;
      gap: 14px;
      z-index: 50;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .heart {
      width: 48px;
      height: 48px;
      background-image: url('heart.png');
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      transition: filter 0.2s ease;
    }

    .heart.empty {
      filter: grayscale(100%) opacity(0.35);
    }

    /* Top Left Key Inventory Icon */
    #hud-key {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 40px;
      height: 40px;
      background-image: url('key.png');
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      z-index: 60;
      display: none;
      filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.8));
    }

    /* Version watermark in bottom right */
    #version-tag {
      position: fixed;
      bottom: 12px;
      right: 16px;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<img id="arcade-logo" src="logo.png" alt="JUMBY">

<!-- Start Screen Overlay -->
<div id="start-screen">
  <div id="hue-controls">
    <img id="left-btn-img" class="arrow-btn" src="leftbutton.png" alt="<">
    <img id="right-btn-img" class="arrow-btn" src="rightbutton.png" alt=">">
  </div>

  <div id="menu-buttons-row">
    <img id="tutorial-btn-img" class="menu-btn" src="tutorial.png" alt="TUTORIAL">
    <img id="play-btn-img" class="menu-btn" src="play.png" alt="PLAY">
    <img id="options-btn-img" class="menu-btn" src="options.png" alt="OPTIONS">
  </div>
</div>

<!-- Standalone Player Element -->
<div id="player"></div>

<div id="room">
  <div id="hud-key"></div>
  <div id="fade-overlay"></div>
  
  <div id="game-over-screen">
    <img id="lose-img" src="lose.png" alt="YOU LOSE">
    <div id="game-over-text">Try Again?</div>
    <div class="dialog-options">
      <span id="go-opt-yes" class="option selected">Yes</span>
      <span id="go-opt-no" class="option">No</span>
    </div>
  </div>

  <div id="orb"></div>
  <div id="key-item"></div>
  <div id="dialog-box">
    <div id="dialog-text"></div>
    <div id="dialog-options" class="dialog-options" style="display: none;">
      <span id="opt-yes" class="option selected">Yes</span>
      <span id="opt-no" class="option">No</span>
    </div>
  </div>
</div>

<div id="hud-container">
  <div class="heart" id="heart-0"></div>
  <div class="heart" id="heart-1"></div>
  <div class="heart" id="heart-2"></div>
</div>

<!-- Bottom Right Version Tag -->
<div id="version-tag">JUMBY_VER_67</div>

<script>
  const TILE_SIZE = 50;
  const COLS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  
  const roomDiv = document.getElementById('room');
  const player = document.getElementById('player');
  const orb = document.getElementById('orb');
  const keyItem = document.getElementById('key-item');
  const hudKey = document.getElementById('hud-key');
  const fadeOverlay = document.getElementById('fade-overlay');
  const dialogBox = document.getElementById('dialog-box');
  const dialogText = document.getElementById('dialog-text');
  const dialogOptions = document.getElementById('dialog-options');
  const optYes = document.getElementById('opt-yes');
  const optNo = document.getElementById('opt-no');

  const startScreen = document.getElementById('start-screen');
  const playBtnImg = document.getElementById('play-btn-img');
  const tutorialBtnImg = document.getElementById('tutorial-btn-img');
  const optionsBtnImg = document.getElementById('options-btn-img');
  const leftBtnImg = document.getElementById('left-btn-img');
  const rightBtnImg = document.getElementById('right-btn-img');
  const hudContainer = document.getElementById('hud-container');

  const gameOverScreen = document.getElementById('game-over-screen');
  const goOptYes = document.getElementById('go-opt-yes');
  const goOptNo = document.getElementById('go-opt-no');

  // Audio Tracks
  const bgm = new Audio('bassline.mp3');
  bgm.loop = true;

  const walkSfx = new Audio('walk.mp3');
  walkSfx.loop = true;

  function playJingleSfx() {
    const jingleSfx = new Audio('jingle.mp3');
    jingleSfx.play().catch(() => {});
  }

  function playSpitSfx() {
    const spitSfx = new Audio('spit.mp3');
    spitSfx.play().catch(() => {});
  }

  function playDamageSfx() {
    const damageSfx = new Audio('damage.mp3');
    damageSfx.play().catch(() => {});
  }

  function playLoseSfx() {
    const loseSfx = new Audio('lose.mp3');
    loseSfx.play().catch(() => {});
  }

  function playStarDeathSfx() {
    const starDeathSfx = new Audio('stardeath.mp3');
    starDeathSfx.play().catch(() => {});
  }

  function playUnlockSfx() {
    const unlockSfx = new Audio('unlock.mp3');
    unlockSfx.play().catch(() => {});
  }

  function playSwitchSfx() {
    const switchSfx = new Audio('switch.mp3');
    switchSfx.play().catch(() => {});
  }

  function playHoverSfx() {
    const hoverSfx = new Audio('hover.mp3');
    hoverSfx.play().catch(() => {});
  }

  // Hover SFX for Title Screen Buttons
  [tutorialBtnImg, playBtnImg, optionsBtnImg].forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      if (!gameStarted) {
        playHoverSfx();
      }
    });
  });

  let gameStarted = false;
  let isGameOver = false;
  let gameOverOption = 'yes';

  let currentRoom = 1;
  let isTransitioning = false;
  let hasBulletAbility = false;
  let orbAbsorbed = false;
  let hasKey = false;
  let keyDropped = false;
  let keyPickedUp = false;
  let keyX = 0;
  let keyY = 0;
  let room3Unlocked = false;

  let inPrompt = false;
  let selectedOption = 'yes';

  let playerHp = 3;
  let isInvincible = false;

  // Hue Shift Logic
  const hues = [0, 72, 144, 216, 288];
  let currentHueIndex = 0;

  function updatePlayerHue() {
    const hueVal = hues[currentHueIndex];
    player.style.filter = hueVal === 0 ? 'none' : `hue-rotate(${hueVal}deg)`;
  }

  function nextHue() {
    currentHueIndex = (currentHueIndex + 1) % hues.length;
    updatePlayerHue();
    playSwitchSfx();
  }

  leftBtnImg.addEventListener('click', () => {
    currentHueIndex = (currentHueIndex - 1 + hues.length) % hues.length;
    updatePlayerHue();
    playSwitchSfx();
  });

  rightBtnImg.addEventListener('click', nextHue);

  player.addEventListener('click', () => {
    if (!gameStarted) {
      nextHue();
    }
  });

  // Game Coordinates
  let posX = 276, posY = 150, speed = 3.75;

  player.style.left = '50vw';
  player.style.top = '50vh';
  player.style.transform = 'translate(-50%, -50%) scale(6)';

  function getCanvasOffset() {
    const rect = roomDiv.getBoundingClientRect();
    return {
      left: rect.left,
      top: rect.top
    };
  }

  function updatePlayerPosition() {
    if (!gameStarted) return;
    const offset = getCanvasOffset();
    player.style.left = (offset.left + (posX * 1.5)) + 'px';
    player.style.top = (offset.top + (posY * 1.5)) + 'px';
  }

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;

    player.style.cursor = 'default';
    playJingleSfx();

    const offset = getCanvasOffset();
    player.style.transition = 'left 1.2s cubic-bezier(0.4, 0, 0.2, 1), top 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
    player.style.left = (offset.left + (posX * 1.5)) + 'px';
    player.style.top = (offset.top + (posY * 1.5)) + 'px';

    startScreen.style.opacity = '0';
    
    roomDiv.style.opacity = '1';
    hudContainer.style.opacity = '1';

    player.classList.add('start-animation');

    setTimeout(() => {
      startScreen.style.display = 'none';
      player.classList.remove('start-animation');
      player.style.transition = 'none';
      player.style.transform = 'scale(1)';
      player.style.transformOrigin = 'top left';
    }, 1200);
  }

  playBtnImg.addEventListener('click', startGame);

  function updateHeartsUI() {
    for (let i = 0; i < 3; i++) {
      const heartEl = document.getElementById(`heart-${i}`);
      if (i < playerHp) {
        heartEl.classList.remove('empty');
      } else {
        heartEl.classList.add('empty');
      }
    }
  }

  function updateKeyUI() {
    hudKey.style.display = hasKey ? 'block' : 'none';
  }

  function triggerGameOver() {
    isGameOver = true;
    bgm.pause();
    walkSfx.pause();
    playLoseSfx();

    gameOverOption = 'yes';
    updateGameOverUI();
    gameOverScreen.style.display = 'flex';
    setTimeout(() => {
      gameOverScreen.style.opacity = '1';
    }, 50);
  }

  function resetGame() {
    playerHp = 3;
    updateHeartsUI();
    isGameOver = false;
    gameOverScreen.style.opacity = '0';
    setTimeout(() => {
      gameOverScreen.style.display = 'none';
    }, 500);

    posX = 276;
    posY = 150;
    updatePlayerPosition();
    loadRoom(1);
  }

  function returnToTitleScreen() {
    playerHp = 3;
    updateHeartsUI();
    isGameOver = false;
    gameStarted = false;
    hasBulletAbility = false;
    orbAbsorbed = false;
    hasKey = false;
    keyDropped = false;
    keyPickedUp = false;
    room3Unlocked = false;
    updateKeyUI();

    gameOverScreen.style.opacity = '0';
    setTimeout(() => {
      gameOverScreen.style.display = 'none';
    }, 500);

    roomDiv.style.opacity = '0';
    hudContainer.style.opacity = '0';

    startScreen.style.display = 'flex';
    setTimeout(() => {
      startScreen.style.opacity = '1';
    }, 50);

    player.style.cursor = 'pointer';
    player.style.transition = 'none';
    player.style.left = '50vw';
    player.style.top = '50vh';
    player.style.transform = 'translate(-50%, -50%) scale(6)';

    posX = 276;
    posY = 150;
    loadRoom(1);
  }

  function takePlayerDamage() {
    if (isInvincible || playerHp <= 0 || isGameOver) return;
    playDamageSfx();
    playerHp--;
    updateHeartsUI();

    if (playerHp <= 0) {
      triggerGameOver();
      return;
    }

    isInvincible = true;
    player.classList.add('invincible');
    setTimeout(() => {
      isInvincible = false;
      player.classList.remove('invincible');
    }, 1000);
  }

  const starEntities = [];

  function createStar(roomNum, x, y) {
    const el = document.createElement('div');
    el.className = 'star-entity';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.display = 'none';
    roomDiv.appendChild(el);

    starEntities.push({
      element: el,
      room: roomNum,
      x: x,
      y: y,
      width: 48,
      height: 80,
      hp: 4,
      alive: true,
      vx: 0,
      vy: 0,
      state: 'idle',
      timer: Math.random() * 60,
      shootTimer: 0
    });
  }

  createStar(3, 480, 160);

  for (let i = 0; i < 8; i++) {
    const randomX = Math.floor(Math.random() * (450 - 60 + 1)) + 60;
    const randomY = Math.floor(Math.random() * (220 - 60 + 1)) + 60;
    createStar(4, randomX, randomY);
  }

  const rooms = {
    1: {
      walls: ['A1','B1','C1','D1','E1','F1','G1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7',
              'L2','L3','L4','L5','L6','L7'],
      doors: {
        'F8': { targetRoom: 2, spawnX: 276, spawnY: 60 },
        'G8': { targetRoom: 2, spawnX: 276, spawnY: 60 }
      },
      hasOrb: false
    },
    2: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F1': { targetRoom: 1, spawnX: 276, spawnY: 260, isTop: true },
        'G1': { targetRoom: 1, spawnX: 276, spawnY: 260, isTop: true },
        'F8': { targetRoom: 3, spawnX: 276, spawnY: 60 },
        'G8': { targetRoom: 3, spawnX: 276, spawnY: 60 }
      },
      hasOrb: true
    },
    3: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F1': { targetRoom: 2, spawnX: 276, spawnY: 260, isTop: true },
        'G1': { targetRoom: 2, spawnX: 276, spawnY: 260, isTop: true },
        'F8': { targetRoom: 4, spawnX: 276, spawnY: 60, locked: true },
        'G8': { targetRoom: 4, spawnX: 276, spawnY: 60, locked: true }
      },
      hasOrb: false
    },
    4: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F1': { targetRoom: 3, spawnX: 276, spawnY: 260, isTop: true },
        'G1': { targetRoom: 3, spawnX: 276, spawnY: 260, isTop: true },
        'F8': { targetRoom: 5, spawnX: 276, spawnY: 60 },
        'G8': { targetRoom: 5, spawnX: 276, spawnY: 60 }
      },
      hasOrb: false
    },
    5: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8',
              'F8','G8'],
      doors: {
        'F1': { targetRoom: 4, spawnX: 276, spawnY: 260, isTop: true },
        'G1': { targetRoom: 4, spawnX: 276, spawnY: 260, isTop: true }
      },
      hasOrb: false
    }
  };

  const gridMap = {};

  for (let r = 1; r <= 8; r++) {
    for (let c = 0; c < 12; c++) {
      const tileName = `${COLS[c]}${r}`;
      const tileDiv = document.createElement('div');
      tileDiv.className = 'tile';
      tileDiv.id = `tile-${tileName}`;

      gridMap[tileName] = { element: tileDiv, x: c * TILE_SIZE, y: (r - 1) * TILE_SIZE, solid: false };
      roomDiv.appendChild(tileDiv);
    }
  }

  function loadRoom(roomNum) {
    currentRoom = roomNum;
    const roomData = rooms[roomNum];

    if (roomNum === 2) {
      if (bgm.paused) {
        bgm.play().catch(() => {
          window.addEventListener('keydown', () => { bgm.play(); }, { once: true });
        });
      }
    } else {
      bgm.pause();
      bgm.currentTime = 0;
    }

    for (let r = 1; r <= 8; r++) {
      for (let c = 0; c < 12; c++) {
        const tileName = `${COLS[c]}${r}`;
        const tile = gridMap[tileName];
        tile.element.className = 'tile';

        if (roomData.walls.includes(tileName)) {
          tile.element.style.backgroundImage = "url('wall.png')";
          tile.solid = true;
        } else if (roomData.doors[tileName]) {
          const doorData = roomData.doors[tileName];
          if (doorData.locked && !room3Unlocked) {
            tile.element.style.backgroundImage = "url('lockeddoor.png')";
          } else {
            tile.element.style.backgroundImage = "url('door.png')";
          }
          if (doorData.isTop) {
            tile.element.classList.add('door-top');
          }
          tile.solid = false;
        } else {
          tile.element.style.backgroundImage = "url('texture1.png')";
          tile.solid = false;
        }
      }
    }

    orb.style.display = (roomData.hasOrb && !orbAbsorbed) ? 'block' : 'none';
    keyItem.style.display = (roomNum === 3 && keyDropped && !keyPickedUp) ? 'block' : 'none';

    starEntities.forEach(star => {
      star.element.style.display = (star.room === roomNum && star.alive) ? 'block' : 'none';
    });
  }

  loadRoom(1);

  const animations = {
    idle_down: ['idle_1.png', 'idle_2.png'],
    idle_up: ['backidle_1.png', 'backidle_2.png'],
    idle_left: ['leftidle_1.png', 'leftidle_2.png'],
    idle_right: ['rightidle_1.png', 'rightidle_2.png'],
    down: ['front_1.png', 'front_2.png', 'front_3.png', 'front_4.png'],
    up: ['back_1.png', 'back_2.png', 'back_3.png', 'back_4.png'],
    left: ['left_1.png', 'left_2.png', 'left_3.png', 'left_4.png'],
    right: ['right_1.png', 'right_2.png', 'right_3.png', 'right_4.png']
  };

  const frameElements = {};
  Object.entries(animations).forEach(([key, srcArray]) => {
    frameElements[key] = srcArray.map((src) => {
      const img = document.createElement('img');
      img.src = src;
      player.appendChild(img);
      return img;
    });
  });

  let activeImgElement = null;
  function showFrame(animKey, index) {
    if (activeImgElement) activeImgElement.style.display = 'none';
    const targetElement = frameElements[animKey][index];
    if (targetElement) {
      targetElement.style.display = 'block';
      activeImgElement = targetElement;
    }
  }

  showFrame('idle_down', 0);

  let frameIndex = 0, lastDir = 'down', currentDir = 'down', animTimer = 0;
  const keys = {};

  const activeBullets = [];
  const enemyBullets = [];

  goOptYes.addEventListener('click', () => {
    if (isGameOver) {
      resetGame();
    }
  });

  goOptNo.addEventListener('click', () => {
    if (isGameOver) {
      returnToTitleScreen();
    }
  });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;

    if (!gameStarted) {
      if (k === ' ' || k === 'enter' || k === 'e') {
        startGame();
      } else if (k === 'a' || k === 'arrowleft') {
        currentHueIndex = (currentHueIndex - 1 + hues.length) % hues.length;
        updatePlayerHue();
        playSwitchSfx();
      } else if (k === 'd' || k === 'arrowright') {
        nextHue();
      }
      return;
    }

    if (isGameOver) {
      if (k === 'a' || k === 'arrowleft') {
        gameOverOption = 'yes';
        updateGameOverUI();
      } else if (k === 'd' || k === 'arrowright') {
        gameOverOption = 'no';
        updateGameOverUI();
      } else if (k === ' ' || k === 'enter') {
        if (gameOverOption === 'yes') {
          resetGame();
        } else {
          returnToTitleScreen();
        }
      }
      return;
    }

    if (inPrompt) {
      if (k === 'a' || k === 'arrowleft') {
        selectedOption = 'yes';
        updatePromptUI();
      } else if (k === 'd' || k === 'arrowright') {
        selectedOption = 'no';
        updatePromptUI();
      } else if (k === ' ' || k === 'enter') {
        confirmPrompt();
      }
      return;
    }

    if (k === 'e') {
      interact();
    } else if (k === ' ' && hasBulletAbility) {
      shootBullet();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function updateGameOverUI() {
    if (gameOverOption === 'yes') {
      goOptYes.classList.add('selected');
      goOptNo.classList.remove('selected');
    } else {
      goOptNo.classList.add('selected');
      goOptYes.classList.remove('selected');
    }
  }

  function updatePromptUI() {
    if (selectedOption === 'yes') {
      optYes.classList.add('selected');
      optNo.classList.remove('selected');
    } else {
      optNo.classList.add('selected');
      optYes.classList.remove('selected');
    }
  }

  function openOrbPrompt() {
    inPrompt = true;
    selectedOption = 'yes';
    updatePromptUI();
    dialogText.innerText = "A mysterious orb. Absorb it?";
    dialogOptions.style.display = 'flex';
    dialogBox.style.display = 'block';
  }

  function confirmPrompt() {
    inPrompt = false;
    dialogOptions.style.display = 'none';

    if (selectedOption === 'yes') {
      hasBulletAbility = true;
      orbAbsorbed = true;
      orb.style.display = 'none';
      dialogText.innerText = "You absorbed the orb! Press SPACE to shoot.";
      setTimeout(() => { dialogBox.style.display = 'none'; }, 2500);
    } else {
      dialogBox.style.display = 'none';
    }
  }

  function checkInteractables() {
    // Clear highlights
    orb.classList.remove('interact-highlight');
    keyItem.classList.remove('interact-highlight');
    gridMap['F8'].element.classList.remove('interact-highlight');
    gridMap['G8'].element.classList.remove('interact-highlight');

    if (!gameStarted || isGameOver || isTransitioning || inPrompt) return;

    const playerBox = { left: posX + 4, right: posX + 44, top: posY + 40, bottom: posY + 80 };

    // Check Orb (Room 2)
    if (currentRoom === 2 && !orbAbsorbed) {
      const orbArea = { left: 230, right: 370, top: 130, bottom: 270 };
      if (playerBox.right > orbArea.left && playerBox.left < orbArea.right &&
          playerBox.bottom > orbArea.top && playerBox.top < orbArea.bottom) {
        orb.classList.add('interact-highlight');
      }
    }

    // Automatic Key Pickup Check (Room 3)
    if (currentRoom === 3 && keyDropped && !keyPickedUp) {
      const keyBox = { left: keyX - 10, right: keyX + 42, top: keyY - 10, bottom: keyY + 42 };
      if (playerBox.right > keyBox.left && playerBox.left < keyBox.right &&
          playerBox.bottom > keyBox.top && playerBox.top < keyBox.bottom) {
        keyPickedUp = true;
        hasKey = true;
        keyItem.style.display = 'none';
        updateKeyUI();
        dialogText.innerText = "Picked up the key!";
        dialogBox.style.display = 'block';
        setTimeout(() => { dialogBox.style.display = 'none'; }, 2000);
      }
    }

    // Check Locked Door (Room 3)
    if (currentRoom === 3 && !room3Unlocked) {
      const doorArea = { left: 230, right: 370, top: 290, bottom: 400 };
      if (playerBox.right > doorArea.left && playerBox.left < doorArea.right &&
          playerBox.bottom > doorArea.top && playerBox.top < doorArea.bottom) {
        gridMap['F8'].element.classList.add('interact-highlight');
        gridMap['G8'].element.classList.add('interact-highlight');
      }
    }
  }

  function interact() {
    const playerBox = { left: posX + 4, right: posX + 44, top: posY + 40, bottom: posY + 80 };

    if (rooms[currentRoom].hasOrb && !orbAbsorbed) {
      const orbArea = { left: 230, right: 370, top: 130, bottom: 270 };

      if (playerBox.right > orbArea.left && playerBox.left < orbArea.right &&
          playerBox.bottom > orbArea.top && playerBox.top < orbArea.bottom) {
        openOrbPrompt();
        return;
      }
    }

    if (currentRoom === 3 && !room3Unlocked) {
      const doorArea = { left: 230, right: 370, top: 290, bottom: 400 };
      if (playerBox.right > doorArea.left && playerBox.left < doorArea.right &&
          playerBox.bottom > doorArea.top && playerBox.top < doorArea.bottom) {
        if (hasKey) {
          room3Unlocked = true;
          hasKey = false; // Consume key when opening
          updateKeyUI();
          rooms[3].doors['F8'].locked = false;
          rooms[3].doors['G8'].locked = false;
          gridMap['F8'].element.style.backgroundImage = "url('door.png')";
          gridMap['G8'].element.style.backgroundImage = "url('door.png')";
          playUnlockSfx();
          dialogText.innerText = "Door unlocked!";
          dialogBox.style.display = 'block';
          setTimeout(() => { dialogBox.style.display = 'none'; }, 2000);
        } else {
          dialogText.innerText = "It's locked. You need a key.";
          dialogBox.style.display = 'block';
          setTimeout(() => { dialogBox.style.display = 'none'; }, 2000);
        }
      }
    }
  }

  function shootBullet() {
    playSpitSfx();

    const bulletDiv = document.createElement('div');
    bulletDiv.className = 'bullet';
    bulletDiv.style.backgroundImage = "url('bullet.png')";

    let bX = posX + 16;
    let bY = posY + 32;

    let velX = 0;
    let velY = 0;
    const bulletSpeed = 7;

    if (lastDir === 'up') velY = -bulletSpeed;
    else if (lastDir === 'down') velY = bulletSpeed;
    else if (lastDir === 'left') velX = -bulletSpeed;
    else if (lastDir === 'right') velX = bulletSpeed;

    bulletDiv.style.left = bX + 'px';
    bulletDiv.style.top = bY + 'px';
    roomDiv.appendChild(bulletDiv);

    activeBullets.push({ element: bulletDiv, x: bX, y: bY, vx: velX, vy: velY });
  }

  function enemyShoot(star) {
    const eBullet = document.createElement('div');
    eBullet.className = 'enemy-bullet';
    eBullet.style.backgroundImage = "url('bullet.png')";

    const startX = star.x + 16;
    const startY = star.y + 32;

    const targetX = posX + 24;
    const targetY = posY + 40;
    const angle = Math.atan2(targetY - startY, targetX - startX);

    const bSpeed = 4.5;
    const vx = Math.cos(angle) * bSpeed;
    const vy = Math.sin(angle) * bSpeed;

    eBullet.style.left = startX + 'px';
    eBullet.style.top = startY + 'px';
    roomDiv.appendChild(eBullet);

    enemyBullets.push({ element: eBullet, x: startX, y: startY, vx: vx, vy: vy, room: star.room });
  }

  function updateStars() {
    starEntities.forEach(star => {
      if (star.room !== currentRoom || !star.alive) return;

      star.shootTimer++;
      if (star.shootTimer >= 120) {
        star.shootTimer = 0;
        enemyShoot(star);
      }

      star.timer--;
      if (star.timer <= 0) {
        if (star.state === 'idle') {
          star.state = 'walking';
          star.timer = Math.floor(Math.random() * 60) + 40;
          const dirs = [{x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}, {x: 0.7, y: 0.7}, {x: -0.7, y: -0.7}];
          const chosen = dirs[Math.floor(Math.random() * dirs.length)];
          star.vx = chosen.x * 1.5;
          star.vy = chosen.y * 1.5;
        } else {
          star.state = 'idle';
          star.timer = 120;
          star.vx = 0;
          star.vy = 0;
        }
      }

      if (star.state === 'walking') {
        const nextX = Math.max(50, Math.min(500, star.x + star.vx));
        const nextY = Math.max(50, Math.min(270, star.y + star.vy));
        star.x = nextX;
        star.y = nextY;
        star.element.style.left = star.x + 'px';
        star.element.style.top = star.y + 'px';
      }
    });
  }

  function updateBullets() {
    for (let i = activeBullets.length - 1; i >= 0; i--) {
      const b = activeBullets[i];
      b.x += b.vx;
      b.y += b.vy;

      let bulletHit = false;

      for (const star of starEntities) {
        if (star.room === currentRoom && star.alive) {
          if (b.x + 16 > star.x && b.x < star.x + star.width &&
              b.y + 16 > star.y + 20 && b.y < star.y + star.height) {
            
            star.hp--;

            star.element.classList.add('hit');
            setTimeout(() => { star.element.classList.remove('hit'); }, 150);

            if (star.hp <= 0) {
              star.alive = false;
              playStarDeathSfx();
              star.element.style.opacity = '0';
              setTimeout(() => { star.element.style.display = 'none'; }, 600);

              if (star.room === 3) {
                keyDropped = true;
                keyX = star.x + 8;
                keyY = star.y + 24;
                keyItem.style.left = keyX + 'px';
                keyItem.style.top = keyY + 'px';
                keyItem.style.display = 'block';
              }
            } else {
              playDamageSfx();
            }

            b.element.remove();
            activeBullets.splice(i, 1);
            bulletHit = true;
            break;
          }
        }
      }

      if (bulletHit) continue;

      if (b.x < 0 || b.x > 584 || b.y < 0 || b.y > 384) {
        b.element.remove();
        activeBullets.splice(i, 1);
        continue;
      }

      b.element.style.left = b.x + 'px';
      b.element.style.top = b.y + 'px';
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      if (eb.room !== currentRoom) {
        eb.element.remove();
        enemyBullets.splice(i, 1);
        continue;
      }

      eb.x += eb.vx;
      eb.y += eb.vy;

      const playerBox = { left: posX + 4, right: posX + 44, top: posY + 40, bottom: posY + 80 };

      if (eb.x + 16 > playerBox.left && eb.x < playerBox.right &&
          eb.y + 16 > playerBox.top && eb.y < playerBox.bottom) {
        takePlayerDamage();
        eb.element.remove();
        enemyBullets.splice(i, 1);
        continue;
      }

      if (eb.x < 0 || eb.x > 584 || eb.y < 0 || eb.y > 384) {
        eb.element.remove();
        enemyBullets.splice(i, 1);
        continue;
      }

      eb.element.style.left = eb.x + 'px';
      eb.element.style.top = eb.y + 'px';
    }
  }

  function isColliding(newX, newY) {
    const playerBox = { left: newX + 4, right: newX + 44, top: newY + 40, bottom: newY + 80 };

    for (const tileKey in gridMap) {
      const tile = gridMap[tileKey];
      if (tile.solid) {
        if (playerBox.right > tile.x && playerBox.left < tile.x + TILE_SIZE &&
            playerBox.bottom > tile.y && playerBox.top < tile.y + TILE_SIZE) {
          return true;
        }
      }
    }

    if (rooms[currentRoom].hasOrb && !orbAbsorbed) {
      const orbBox = { left: 250, right: 350, top: 150, bottom: 250 };
      if (playerBox.right > orbBox.left && playerBox.left < orbBox.right &&
          playerBox.bottom > orbBox.top && playerBox.top < orbBox.bottom) {
        return true;
      }
    }

    for (const star of starEntities) {
      if (star.room === currentRoom && star.alive) {
        if (playerBox.right > star.x + 8 && playerBox.left < star.x + star.width - 8 &&
            playerBox.bottom > star.y + 30 && playerBox.top < star.y + star.height) {
          takePlayerDamage();
          return true;
        }
      }
    }

    return false;
  }

  function checkDoorTriggers() {
    if (isTransitioning) return;

    const feetX = posX + 24;
    const feetY = posY + 35;
    const colIndex = Math.floor(feetX / TILE_SIZE);
    const rowIndex = Math.floor(feetY / TILE_SIZE) + 1;
    const currentTile = `${COLS[colIndex]}${rowIndex}`;

    const door = rooms[currentRoom].doors[currentTile];
    if (door) {
      if (door.locked && !room3Unlocked) {
        return;
      }

      isTransitioning = true;
      fadeOverlay.style.opacity = '1';

      setTimeout(() => {
        loadRoom(door.targetRoom);
        posX = door.spawnX;
        posY = door.spawnY;
        updatePlayerPosition();

        setTimeout(() => {
          fadeOverlay.style.opacity = '0';
          isTransitioning = false;
        }, 150);
      }, 300);
    }
  }

  const orbFrames = ['orb1.png', 'orb2.png'];
  let orbFrameIndex = 0;

  const starFrames = ['star1.png', 'star2.png', 'star3.png', 'star4.png'];
  let starFrameIndex = 0;

  updateHeartsUI();

  function gameLoop() {
    let dx = 0, dy = 0;

    if (gameStarted && !isGameOver && !isTransitioning && !inPrompt) {
      if (keys['w'] || keys['arrowup']) { dy -= speed; currentDir = 'up'; lastDir = 'up'; }
      else if (keys['s'] || keys['arrowdown']) { dy += speed; currentDir = 'down'; lastDir = 'down'; }
      
      if (keys['a'] || keys['arrowleft']) { dx -= speed; currentDir = 'left'; lastDir = 'left'; }
      else if (keys['d'] || keys['arrowright']) { dx += speed; currentDir = 'right'; lastDir = 'right'; }

      const currentlyMoving = dx !== 0 || dy !== 0;

      if (currentlyMoving) {
        if (walkSfx.paused) walkSfx.play().catch(() => {});
      } else {
        if (!walkSfx.paused) walkSfx.pause();
      }

      const nextX = Math.max(0, Math.min(roomDiv.clientWidth - 48, posX + dx));
      const nextY = Math.max(0, Math.min(roomDiv.clientHeight - 80, posY + dy));

      if (!isColliding(nextX, posY)) posX = nextX;
      if (!isColliding(posX, nextY)) posY = nextY;

      updatePlayerPosition();

      updateStars();
      checkDoorTriggers();
      checkInteractables();
    } else {
      if (!walkSfx.paused) walkSfx.pause();
    }

    animTimer++;
    const currentlyMoving = dx !== 0 || dy !== 0;
    const animKey = currentlyMoving ? currentDir : `idle_${lastDir}`;
    const rate = currentlyMoving ? 6 : 20;

    if (animTimer % rate === 0) {
      frameIndex = (frameIndex + 1) % animations[animKey].length;
    }

    if (frameIndex >= animations[animKey].length) {
      frameIndex = 0;
    }

    showFrame(animKey, frameIndex);

    if (animTimer % 25 === 0 && !orbAbsorbed) {
      orbFrameIndex = (orbFrameIndex + 1) % orbFrames.length;
      orb.style.backgroundImage = `url('${orbFrames[orbFrameIndex]}')`;
    }

    if (animTimer % 12 === 0) {
      starFrameIndex = (starFrameIndex + 1) % starFrames.length;
      starEntities.forEach(star => {
        if (star.alive) {
          star.element.style.backgroundImage = `url('${starFrames[starFrameIndex]}')`;
        }
      });
    }

    if (gameStarted && !isGameOver) {
      updateBullets();
    }

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>

</body>
</html>

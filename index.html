<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkable Room</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #arcade-logo {
      width: 320px;
      height: auto;
      max-height: 100px;
      margin-bottom: 20px;
      image-rendering: pixelated;
      object-fit: contain;
    }

    #room {
      width: 600px;
      height: 400px;
      background-color: #333;
      border: none; /* Borderless */
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 48px;
      height: 80px;
      position: absolute;
      image-rendering: pixelated;
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

<!-- Arcade Top Logo -->
<img id="arcade-logo" src="logo.png" alt="Game Logo">

<div id="room">
  <div id="player"></div>
</div>

<script>
  const player = document.getElementById('player');
  const room = document.getElementById('room');

  // Sprite animation dictionaries
  const animations = {
    idle: ['idle_1.png', 'idle_2.png'],
    down: ['front_1.png', 'front_2.png', 'front_3.png', 'front_4.png'],
    up: ['back_1.png', 'back_2.png', 'back_3.png', 'back_4.png'],
    left: ['left_1.png', 'left_2.png', 'left_3.png', 'left_4.png'],
    right: ['right_1.png', 'right_2.png', 'right_3.png', 'right_4.png']
  };

  // Preload all images into cache to eliminate flicker/disappearing frame issues
  const preloadedImages = [];
  Object.values(animations).flat().concat(['logo.png']).forEach((src) => {
    const img = new Image();
    img.src = src;
    preloadedImages.push(img);
  });

  let posX = 276;
  let posY = 160;
  const speed = 3;
  
  let frameIndex = 0;
  let currentDir = 'down';
  let isMoving = false;
  let animTimer = 0;

  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function gameLoop() {
    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) { dy -= speed; currentDir = 'up'; }
    else if (keys['s'] || keys['arrowdown']) { dy += speed; currentDir = 'down'; }
    
    if (keys['a'] || keys['arrowleft']) { dx -= speed; currentDir = 'left'; }
    else if (keys['d'] || keys['arrowright']) { dx += speed; currentDir = 'right'; }

    const currentlyMoving = dx !== 0 || dy !== 0;

    // Reset frame state on movement toggle
    if (currentlyMoving !== isMoving) {
      isMoving = currentlyMoving;
      frameIndex = 0;
      animTimer = 0;
    }

    // Keep sprite in room boundaries
    posX = Math.max(0, Math.min(room.clientWidth - 48, posX + dx));
    posY = Math.max(0, Math.min(room.clientHeight - 80, posY + dy));

    player.style.left = posX + 'px';
    player.style.top = posY + 'px';

    // Animation Speed Controller
    animTimer++;

    if (isMoving) {
      const currentFrames = animations[currentDir];
      if (animTimer % 8 === 0) { // Walk speed
        frameIndex = (frameIndex + 1) % currentFrames.length;
      }
      player.style.backgroundImage = `url('${currentFrames[frameIndex]}')`;
    } else {
      const currentFrames = animations.idle;
      if (animTimer % 20 === 0) { // Idle bounce speed
        frameIndex = (frameIndex + 1) % currentFrames.length;
      }
      player.style.backgroundImage = `url('${currentFrames[frameIndex]}')`;
    }

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>

</body>
</html>

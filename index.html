<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumby - Grid World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1a0d;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #arcade-logo {
      width: 1120px;
      height: auto;
      margin-top: 10px;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    #room {
      width: 600px;
      height: 400px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(12, 50px);
      grid-template-rows: repeat(8, 50px);
      transform: scale(1.5);
      transform-origin: top center;
    }

    .tile {
      width: 50px;
      height: 50px;
      background-size: cover;
      image-rendering: pixelated;
    }

    #player {
      width: 48px;
      height: 80px;
      position: absolute;
      z-index: 10;
    }

    /* Zero-flicker frame rendering */
    #player img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      image-rendering: pixelated;
      object-fit: contain;
    }

    #dialog-box {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 15px;
      border: 2px solid #fff;
      font-size: 14px;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>

<img id="arcade-logo" src="logo.png" alt="JUMBY">

<div id="room">
  <div id="player"></div>
  <div id="dialog-box"></div>
</div>

<script>
  const TILE_SIZE = 50;
  const COLS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  const player = document.getElementById('player');
  const room = document.getElementById('room');
  const dialogBox = document.getElementById('dialog-box');

  const defaultTile = 'tile.png';
  const specialTiles = {
    'C3': { texture: 'rock.png', solid: true, message: "It's a solid rock!" },
    'H5': { texture: 'chest.png', solid: true, message: "You opened the chest!" }
  };

  // Generate Map
  const gridMap = {};
  for (let r = 1; r <= 8; r++) {
    for (let c = 0; c < 12; c++) {
      const tileName = `${COLS[c]}${r}`;
      const tileDiv = document.createElement('div');
      tileDiv.className = 'tile';
      tileDiv.id = `tile-${tileName}`;

      const config = specialTiles[tileName] || { texture: defaultTile, solid: false };
      tileDiv.style.backgroundImage = `url('${config.texture}')`;
      
      gridMap[tileName] = { element: tileDiv, x: c * TILE_SIZE, y: (r - 1) * TILE_SIZE, ...config };
      room.appendChild(tileDiv);
    }
  }

  // Animation sets (includes new backidle frames)
  const animations = {
    idle_down: ['idle_1.png', 'idle_2.png'],
    idle_up: ['backidle_1.png', 'backidle_2.png'],
    idle_left: ['idle_1.png', 'idle_2.png'],
    idle_right: ['idle_1.png', 'idle_2.png'],
    down: ['front_1.png', 'front_2.png', 'front_3.png', 'front_4.png'],
    up: ['back_1.png', 'back_2.png', 'back_3.png', 'back_4.png'],
    left: ['left_1.png', 'left_2.png', 'left_3.png', 'left_4.png'],
    right: ['right_1.png', 'right_2.png', 'right_3.png', 'right_4.png']
  };

  // Mount images inside DOM to prevent flicker
  const frameElements = {};
  Object.entries(animations).forEach(([key, srcArray]) => {
    frameElements[key] = srcArray.map((src) => {
      const img = document.createElement('img');
      img.src = src;
      player.appendChild(img);
      return img;
    });
  });

  let activeImgElement = null;

  function showFrame(animKey, index) {
    if (activeImgElement) activeImgElement.style.display = 'none';
    const targetElement = frameElements[animKey][index];
    if (targetElement) {
      targetElement.style.display = 'block';
      activeImgElement = targetElement;
    }
  }

  let posX = 250, posY = 150, speed = 3;
  let frameIndex = 0, lastDir = 'down', currentDir = 'down', isMoving = false, animTimer = 0;
  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e') interact();
  });

  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  function isColliding(newX, newY) {
    const playerBox = { left: newX + 4, right: newX + 44, top: newY + 40, bottom: newY + 80 };

    for (const tileKey in gridMap) {
      const tile = gridMap[tileKey];
      if (tile.solid) {
        if (playerBox.right > tile.x && playerBox.left < tile.x + TILE_SIZE &&
            playerBox.bottom > tile.y && playerBox.top < tile.y + TILE_SIZE) {
          return true;
        }
      }
    }
    return false;
  }

  function interact() {
    let checkX = posX + 24;
    let checkY = posY + 60;

    if (lastDir === 'up') checkY -= 30;
    if (lastDir === 'down') checkY += 30;
    if (lastDir === 'left') checkX -= 30;
    if (lastDir === 'right') checkX += 30;

    const colIndex = Math.floor(checkX / TILE_SIZE);
    const rowIndex = Math.floor(checkY / TILE_SIZE) + 1;
    const tileName = `${COLS[colIndex]}${rowIndex}`;

    if (gridMap[tileName] && gridMap[tileName].message) {
      dialogBox.innerText = gridMap[tileName].message;
      dialogBox.style.display = 'block';
      setTimeout(() => { dialogBox.style.display = 'none'; }, 2500);
    }
  }

  function gameLoop() {
    let dx = 0, dy = 0;

    if (keys['w'] || keys['arrowup']) { dy -= speed; currentDir = 'up'; lastDir = 'up'; }
    else if (keys['s'] || keys['arrowdown']) { dy += speed; currentDir = 'down'; lastDir = 'down'; }
    
    if (keys['a'] || keys['arrowleft']) { dx -= speed; currentDir = 'left'; lastDir = 'left'; }
    else if (keys['d'] || keys['arrowright']) { dx += speed; currentDir = 'right'; lastDir = 'right'; }

    const currentlyMoving = dx !== 0 || dy !== 0;

    const nextX = Math.max(0, Math.min(room.clientWidth - 48, posX + dx));
    const nextY = Math.max(0, Math.min(room.clientHeight - 80, posY + dy));

    if (!isColliding(nextX, posY)) posX = nextX;
    if (!isColliding(posX, nextY)) posY = nextY;

    player.style.left = posX + 'px';
    player.style.top = posY + 'px';

    // Animation Logic
    animTimer++;
    const animKey = currentlyMoving ? currentDir : `idle_${lastDir}`;
    const rate = currentlyMoving ? 8 : 20;

    if (animTimer % rate === 0) {
      frameIndex = (frameIndex + 1) % animations[animKey].length;
    }

    if (frameIndex >= animations[animKey].length) {
      frameIndex = 0;
    }

    showFrame(animKey, frameIndex);

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>

</body>
</html>

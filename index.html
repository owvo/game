<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkable Room</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #room {
      width: 600px;
      height: 400px;
      background-color: #333;
      border: 4px solid #fff;
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 48px;
      height: 80px;
      position: absolute;
      image-rendering: pixelated;
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

<div id="room">
  <div id="player"></div>
</div>

<script>
  const player = document.getElementById('player');
  const room = document.getElementById('room');

  // Sprite animation frames setup
  const frames = [
    'front_1.png',
    'front_2.png',
    'front_3.png',
    'front_4.png'
  ];

  let posX = 276;
  let posY = 160;
  const speed = 3;
  let frameIndex = 0;
  let isMoving = false;
  let animTimer = 0;

  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function gameLoop() {
    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) dy -= speed;
    if (keys['s'] || keys['arrowdown']) dy += speed;
    if (keys['a'] || keys['arrowleft']) dx -= speed;
    if (keys['d'] || keys['arrowright']) dx += speed;

    isMoving = dx !== 0 || dy !== 0;

    // Movement boundaries
    posX = Math.max(0, Math.min(room.clientWidth - 48, posX + dx));
    posY = Math.max(0, Math.min(room.clientHeight - 80, posY + dy));

    player.style.left = posX + 'px';
    player.style.top = posY + 'px';

    // Sprite Animation Logic
    if (isMoving) {
      animTimer++;
      if (animTimer % 8 === 0) { // Adjust speed of animation here
        frameIndex = (frameIndex + 1) % frames.length;
      }
    } else {
      frameIndex = 0; // Default idle frame
    }

    player.style.backgroundImage = `url('${frames[frameIndex]}')`;

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>

</body>
</html>

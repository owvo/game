<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumby - Grid World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1a0d;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #arcade-logo {
      width: 1120px;
      height: auto;
      margin-top: 10px;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    #room {
      width: 600px;
      height: 400px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(12, 50px);
      grid-template-rows: repeat(8, 50px);
      transform: scale(1.5);
      transform-origin: top center;
    }

    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      z-index: 100;
    }

    .tile {
      width: 50px;
      height: 50px;
      background-size: cover;
      image-rendering: pixelated;
    }

    .door-top {
      transform: rotate(180deg);
    }

    #player {
      width: 48px;
      height: 80px;
      position: absolute;
      z-index: 10;
    }

    #player img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      image-rendering: pixelated;
      object-fit: contain;
    }

    #orb {
      width: 100px;
      height: 100px;
      position: absolute;
      left: 250px;
      top: 150px;
      z-index: 5;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      display: none;
    }

    #star-entity {
      width: 60px;
      height: 60px;
      position: absolute;
      left: 480px;
      top: 170px;
      z-index: 8;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      display: none;
      transition: opacity 0.6s ease-out, filter 0.1s ease;
    }

    #star-entity.hit {
      filter: drop-shadow(0px 0px 0px red) sepia(1) hue-rotate(-50deg) saturate(1000%);
    }

    .bullet {
      width: 16px;
      height: 16px;
      position: absolute;
      z-index: 15;
      background-size: contain;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #dialog-box {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 12px 20px;
      border: 2px solid #fff;
      font-size: 14px;
      display: none;
      z-index: 20;
      text-align: center;
    }

    .dialog-options {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .option {
      padding: 2px 8px;
      color: #888;
    }

    .option.selected {
      color: #fff;
      background: #444;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<img id="arcade-logo" src="logo.png" alt="JUMBY">

<div id="room">
  <div id="fade-overlay"></div>
  <div id="orb"></div>
  <div id="star-entity"></div>
  <div id="player"></div>
  <div id="dialog-box">
    <div id="dialog-text"></div>
    <div id="dialog-options" class="dialog-options" style="display: none;">
      <span id="opt-yes" class="option selected">Yes</span>
      <span id="opt-no" class="option">No</span>
    </div>
  </div>
</div>

<script>
  const TILE_SIZE = 50;
  const COLS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  
  const roomDiv = document.getElementById('room');
  const player = document.getElementById('player');
  const orb = document.getElementById('orb');
  const starEntity = document.getElementById('star-entity');
  const fadeOverlay = document.getElementById('fade-overlay');
  const dialogBox = document.getElementById('dialog-box');
  const dialogText = document.getElementById('dialog-text');
  const dialogOptions = document.getElementById('dialog-options');
  const optYes = document.getElementById('opt-yes');
  const optNo = document.getElementById('opt-no');

  // Audio Setup
  const bgm = new Audio('bassline.mp3');
  bgm.loop = true;

  const walkSfx = new Audio('walk.mp3');
  walkSfx.loop = true;

  function playSpitSfx() {
    const spitSfx = new Audio('spit.mp3');
    spitSfx.play().catch(() => {});
  }

  function playDamageSfx() {
    const damageSfx = new Audio('damage.mp3');
    damageSfx.play().catch(() => {});
  }

  let currentRoom = 1;
  let isTransitioning = false;
  let hasBulletAbility = false;
  let orbAbsorbed = false;

  let starHp = 4;
  let starAlive = true;

  let inPrompt = false;
  let selectedOption = 'yes';

  const rooms = {
    1: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F1': { targetRoom: 3, spawnX: 276, spawnY: 260, isTop: true }, // Top doors lead to Room 3
        'G1': { targetRoom: 3, spawnX: 276, spawnY: 260, isTop: true },
        'F8': { targetRoom: 2, spawnX: 276, spawnY: 60 },  // Bottom doors lead to Room 2
        'G8': { targetRoom: 2, spawnX: 276, spawnY: 60 }
      },
      hasOrb: false,
      hasStar: false
    },
    2: {
      walls: ['A1','B1','C1','D1','E1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F1': { targetRoom: 1, spawnX: 276, spawnY: 260, isTop: true }, // Top doors lead back to Room 1
        'G1': { targetRoom: 1, spawnX: 276, spawnY: 260, isTop: true },
        'F8': { targetRoom: 1, spawnX: 276, spawnY: 60 },  // Bottom doors lead back to Room 1
        'G8': { targetRoom: 1, spawnX: 276, spawnY: 60 }
      },
      hasOrb: true,
      hasStar: false
    },
    3: {
      walls: ['A1','B1','C1','D1','E1','F1','G1','H1','I1','J1','K1','L1',
              'A2','A3','A4','A5','A6','A7','A8',
              'L2','L3','L4','L5','L6','L7','L8'],
      doors: {
        'F8': { targetRoom: 1, spawnX: 276, spawnY: 60 },  // Bottom doors lead back to Room 1
        'G8': { targetRoom: 1, spawnX: 276, spawnY: 60 }
      },
      hasOrb: false,
      hasStar: true
    }
  };

  const gridMap = {};

  for (let r = 1; r <= 8; r++) {
    for (let c = 0; c < 12; c++) {
      const tileName = `${COLS[c]}${r}`;
      const tileDiv = document.createElement('div');
      tileDiv.className = 'tile';
      tileDiv.id = `tile-${tileName}`;

      gridMap[tileName] = { element: tileDiv, x: c * TILE_SIZE, y: (r - 1) * TILE_SIZE, solid: false };
      roomDiv.appendChild(tileDiv);
    }
  }

  function loadRoom(roomNum) {
    currentRoom = roomNum;
    const roomData = rooms[roomNum];

    if (roomNum === 2) {
      if (bgm.paused) {
        bgm.play().catch(() => {
          window.addEventListener('keydown', () => { bgm.play(); }, { once: true });
        });
      }
    } else {
      bgm.pause();
      bgm.currentTime = 0;
    }

    for (let r = 1; r <= 8; r++) {
      for (let c = 0; c < 12; c++) {
        const tileName = `${COLS[c]}${r}`;
        const tile = gridMap[tileName];
        tile.element.className = 'tile';

        if (roomData.walls.includes(tileName)) {
          tile.element.style.backgroundImage = "url('wall.png')";
          tile.solid = true;
        } else if (roomData.doors[tileName]) {
          tile.element.style.backgroundImage = "url('door.png')";
          if (roomData.doors[tileName].isTop) {
            tile.element.classList.add('door-top');
          }
          tile.solid = false;
        } else {
          tile.element.style.backgroundImage = "url('texture1.png')";
          tile.solid = false;
        }
      }
    }

    orb.style.display = (roomData.hasOrb && !orbAbsorbed) ? 'block' : 'none';
    starEntity.style.display = (roomData.hasStar && starAlive) ? 'block' : 'none';
  }

  const animations = {
    idle_down: ['idle_1.png', 'idle_2.png'],
    idle_up: ['backidle_1.png', 'backidle_2.png'],
    idle_left: ['leftidle_1.png', 'leftidle_2.png'],
    idle_right: ['rightidle_1.png', 'rightidle_2.png'],
    down: ['front_1.png', 'front_2.png', 'front_3.png', 'front_4.png'],
    up: ['back_1.png', 'back_2.png', 'back_3.png', 'back_4.png'],
    left: ['left_1.png', 'left_2.png', 'left_3.png', 'left_4.png'],
    right: ['right_1.png', 'right_2.png', 'right_3.png', 'right_4.png']
  };

  const frameElements = {};
  Object.entries(animations).forEach(([key, srcArray]) => {
    frameElements[key] = srcArray.map((src) => {
      const img = document.createElement('img');
      img.src = src;
      player.appendChild(img);
      return img;
    });
  });

  let activeImgElement = null;
  function showFrame(animKey, index) {
    if (activeImgElement) activeImgElement.style.display = 'none';
    const targetElement = frameElements[animKey][index];
    if (targetElement) {
      targetElement.style.display = 'block';
      activeImgElement = targetElement;
    }
  }

  let posX = 276, posY = 150, speed = 3.75;
  let frameIndex = 0, lastDir = 'down', currentDir = 'down', animTimer = 0;
  const keys = {};

  const activeBullets = [];

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;

    if (inPrompt) {
      if (k === 'a' || k === 'arrowleft') {
        selectedOption = 'yes';
        updatePromptUI();
      } else if (k === 'd' || k === 'arrowright') {
        selectedOption = 'no';
        updatePromptUI();
      } else if (k === ' ' || k === 'enter') {
        confirmPrompt();
      }
      return;
    }

    if (k === 'e') {
      interact();
    } else if (k === ' ' && hasBulletAbility) {
      shootBullet();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function updatePromptUI() {
    if (selectedOption === 'yes') {
      optYes.classList.add('selected');
      optNo.classList.remove('selected');
    } else {
      optNo.classList.add('selected');
      optYes.classList.remove('selected');
    }
  }

  function openOrbPrompt() {
    inPrompt = true;
    selectedOption = 'yes';
    updatePromptUI();
    dialogText.innerText = "A mysterious orb. Absorb it?";
    dialogOptions.style.display = 'flex';
    dialogBox.style.display = 'block';
  }

  function confirmPrompt() {
    inPrompt = false;
    dialogOptions.style.display = 'none';

    if (selectedOption === 'yes') {
      hasBulletAbility = true;
      orbAbsorbed = true;
      orb.style.display = 'none';
      dialogText.innerText = "You absorbed the orb! Press SPACE to shoot.";
      setTimeout(() => { dialogBox.style.display = 'none'; }, 2500);
    } else {
      dialogBox.style.display = 'none';
    }
  }

  function interact() {
    if (rooms[currentRoom].hasOrb && !orbAbsorbed) {
      const playerBox = { left: posX + 4, right: posX + 44, top: posY + 40, bottom: posY + 80 };
      const orbArea = { left: 230, right: 370, top: 130, bottom: 270 };

      if (playerBox.right > orbArea.left && playerBox.left < orbArea.right &&
          playerBox.bottom > orbArea.top && playerBox.top < orbArea.bottom) {
        openOrbPrompt();
      }
    }
  }

  function shootBullet() {
    playSpitSfx();

    const bulletDiv = document.createElement('div');
    bulletDiv.className = 'bullet';
    bulletDiv.style.backgroundImage = "url('bullet.png')";

    let bX = posX + 16;
    let bY = posY + 32;

    let velX = 0;
    let velY = 0;
    const bulletSpeed = 7;

    if (lastDir === 'up') velY = -bulletSpeed;
    else if (lastDir === 'down') velY = bulletSpeed;
    else if (lastDir === 'left') velX = -bulletSpeed;
    else if (lastDir === 'right') velX = bulletSpeed;

    bulletDiv.style.left = bX + 'px';
    bulletDiv.style.top = bY + 'px';
    roomDiv.appendChild(bulletDiv);

    activeBullets.push({ element: bulletDiv, x: bX, y: bY, vx: velX, vy: velY });
  }

  function updateBullets() {
    const starBox = { left: 480, right: 540, top: 170, bottom: 230 };

    for (let i = activeBullets.length - 1; i >= 0; i--) {
      const b = activeBullets[i];
      b.x += b.vx;
      b.y += b.vy;

      if (rooms[currentRoom].hasStar && starAlive) {
        if (b.x + 16 > starBox.left && b.x < starBox.right &&
            b.y + 16 > starBox.top && b.y < starBox.bottom) {
          
          playDamageSfx();
          starHp--;

          starEntity.classList.add('hit');
          setTimeout(() => { starEntity.classList.remove('hit'); }, 150);

          if (starHp <= 0) {
            starAlive = false;
            starEntity.style.opacity = '0';
            setTimeout(() => { starEntity.style.display = 'none'; }, 600);
          }

          b.element.remove();
          activeBullets.splice(i, 1);
          continue;
        }
      }

      if (b.x < 0 || b.x > 584 || b.y < 0 || b.y > 384) {
        b.element.remove();
        activeBullets.splice(i, 1);
        continue;
      }

      b.element.style.left = b.x + 'px';
      b.element.style.top = b.y + 'px';
    }
  }

  function isColliding(newX, newY) {
    const playerBox = { left: newX + 4, right: newX + 44, top: newY + 40, bottom: newY + 80 };

    for (const tileKey in gridMap) {
      const tile = gridMap[tileKey];
      if (tile.solid) {
        if (playerBox.right > tile.x && playerBox.left < tile.x + TILE_SIZE &&
            playerBox.bottom > tile.y && playerBox.top < tile.y + TILE_SIZE) {
          return true;
        }
      }
    }

    if (rooms[currentRoom].hasOrb && !orbAbsorbed) {
      const orbBox = { left: 250, right: 350, top: 150, bottom: 250 };
      if (playerBox.right > orbBox.left && playerBox.left < orbBox.right &&
          playerBox.bottom > orbBox.top && playerBox.top < orbBox.bottom) {
        return true;
      }
    }

    if (rooms[currentRoom].hasStar && starAlive) {
      const starBox = { left: 480, right: 540, top: 170, bottom: 230 };
      if (playerBox.right > starBox.left && playerBox.left < starBox.right &&
          playerBox.bottom > starBox.top && playerBox.top < starBox.bottom) {
        return true;
      }
    }

    return false;
  }

  function checkDoorTriggers() {
    if (isTransitioning) return;

    const feetX = posX + 24;
    const feetY = posY + 60;
    const colIndex = Math.floor(feetX / TILE_SIZE);
    const rowIndex = Math.floor(feetY / TILE_SIZE) + 1;
    const currentTile = `${COLS[colIndex]}${rowIndex}`;

    const door = rooms[currentRoom].doors[currentTile];
    if (door) {
      isTransitioning = true;
      fadeOverlay.style.opacity = '1';

      setTimeout(() => {
        loadRoom(door.targetRoom);
        posX = door.spawnX;
        posY = door.spawnY;
        player.style.left = posX + 'px';
        player.style.top = posY + 'px';

        setTimeout(() => {
          fadeOverlay.style.opacity = '0';
          isTransitioning = false;
        }, 150);
      }, 300);
    }
  }

  const orbFrames = ['orb1.png', 'orb2.png'];
  let orbFrameIndex = 0;

  const starFrames = ['star1.png', 'star2.png', 'star3.png', 'star4.png'];
  let starFrameIndex = 0;

  loadRoom(1);

  function gameLoop() {
    if (!isTransitioning && !inPrompt) {
      let dx = 0, dy = 0;

      if (keys['w'] || keys['arrowup']) { dy -= speed; currentDir = 'up'; lastDir = 'up'; }
      else if (keys['s'] || keys['arrowdown']) { dy += speed; currentDir = 'down'; lastDir = 'down'; }
      
      if (keys['a'] || keys['arrowleft']) { dx -= speed; currentDir = 'left'; lastDir = 'left'; }
      else if (keys['d'] || keys['arrowright']) { dx += speed; currentDir = 'right'; lastDir = 'right'; }

      const currentlyMoving = dx !== 0 || dy !== 0;

      if (currentlyMoving) {
        if (walkSfx.paused) walkSfx.play().catch(() => {});
      } else {
        if (!walkSfx.paused) walkSfx.pause();
      }

      const nextX = Math.max(0, Math.min(roomDiv.clientWidth - 48, posX + dx));
      const nextY = Math.max(0, Math.min(roomDiv.clientHeight - 80, posY + dy));

      if (!isColliding(nextX, posY)) posX = nextX;
      if (!isColliding(posX, nextY)) posY = nextY;

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      animTimer++;
      const animKey = currentlyMoving ? currentDir : `idle_${lastDir}`;
      const rate = currentlyMoving ? 6 : 20;

      if (animTimer % rate === 0) {
        frameIndex = (frameIndex + 1) % animations[animKey].length;
      }

      if (frameIndex >= animations[animKey].length) {
        frameIndex = 0;
      }

      showFrame(animKey, frameIndex);

      if (animTimer % 25 === 0 && !orbAbsorbed) {
        orbFrameIndex = (orbFrameIndex + 1) % orbFrames.length;
        orb.style.backgroundImage = `url('${orbFrames[orbFrameIndex]}')`;
      }

      if (animTimer % 12 === 0 && starAlive) {
        starFrameIndex = (starFrameIndex + 1) % starFrames.length;
        starEntity.style.backgroundImage = `url('${starFrames[starFrameIndex]}')`;
      }

      checkDoorTriggers();
    } else {
      if (!walkSfx.paused) walkSfx.pause();
    }

    updateBullets();
    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
